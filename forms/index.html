<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | Felipe Carreiro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md bg-zinc-900 p-8 rounded-lg border border-zinc-800"><h1 class="text-2xl font-bold mb-6 bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">Contact Me</h1><form action="#" method="POST" class="space-y-4"><div><label class="block text-sm text-zinc-400 mb-1">Name</label><input type="text" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2 focus:border-violet-500 outline-none"></div><div><label class="block text-sm text-zinc-400 mb-1">Email</label><input type="email" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2 focus:border-violet-500 outline-none"></div><div><label class="block text-sm text-zinc-400 mb-1">Message</label><textarea class="w-full bg-zinc-950 border border-zinc-700 rounded p-2 focus:border-violet-500 outline-none h-32"></textarea></div><button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 py-2 rounded font-bold hover:opacity-90 transition">Send Message</button></form></div></body></html>
