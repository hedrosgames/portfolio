<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Feedback | Felipe Carreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-media {
            position: relative;
            aspect-ratio: 21 / 10;
            overflow: hidden;
            background-color: #27272a;
        }
        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .card-attr {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 1.5rem 0.5rem 0.35rem;
            text-align: right;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.25;
            color: #a1a1aa;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
            pointer-events: none;
            white-space: normal;
            word-break: break-word;
        }

        .badge-container {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 0.5rem;
            align-items: center;
        }
        .badge-link {
            display: block;
            width: 128px;
            height: 40px;
            flex: 0 0 128px;
            line-height: 0;
        }
        .badge-img {
            width: 128px;
            height: 40px;
            object-fit: fill;
            display: block;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl sm:text-3xl font-bold text-center mb-8 sm:mb-12 bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">Game Feedback & Downloads</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
            <!-- Toyland -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800">
                <div class="card-media">
                    <img src="img/Toyland.png" alt="Toyland">
                    <div class="card-attr">Propriedade da Minimol Games</div>
                </div>
                <div class="p-5 sm:p-6">
                    <h2 class="text-xl font-bold mb-4">Toyland</h2>
                    <a href="https://forms.clickup.com/30912035/f/xfbh3-44613/X8BI3UVDMIVPEE76C4" class="text-violet-400 hover:text-violet-300 font-semibold">Deixe seu Feedback</a>
                </div>
            </div>

            <!-- Greek War -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800">
                <div class="card-media">
                    <img src="img/Greek.png" alt="Greek War">
                    <div class="card-attr">Propriedade da Universal Lab</div>
                </div>
                <div class="p-5 sm:p-6">
                    <h2 class="text-xl font-bold mb-4">Greek War</h2>
                    <a href="https://store.steampowered.com/app/3852760/Greek_War/" target="_blank" rel="noopener noreferrer" class="text-violet-400 hover:text-violet-300 font-semibold">Ver na Steam</a>
                </div>
            </div>

            <!-- Case Solved -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800">
                <div class="card-media">
                    <img src="img/Case.png" alt="Case Solved">
                    <div class="card-attr">Propriedade da Minimol Games</div>
                </div>
                <div class="p-5 sm:p-6">
                    <h2 class="text-xl font-bold mb-4">Case Solved</h2>
                    <p class="text-zinc-400 mb-4">Experimente Gratuitamente</p>
                    <div class="badge-container">
                        <a href="https://play.google.com/store/apps/details?id=com.MinimolGames.CaseSolved&hl=pt_PT" target="_blank" rel="noopener noreferrer" class="badge-link" aria-label="Get it on Google Play">
                            <img src="img/google-play.svg" alt="Get it on Google Play" class="badge-img">
                        </a>
                        <a href="https://apps.apple.com/us/app/case-solved-the-london-files/id6769660234?l=pt-BR" target="_blank" rel="noopener noreferrer" class="badge-link" aria-label="Download on the App Store">
                            <img src="img/app-store.svg" alt="Download on the App Store" class="badge-img">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
