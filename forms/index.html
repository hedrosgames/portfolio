<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Feedback | Felipe Carreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-img { height: 200px; width: 100%; object-fit: cover; }
        /* Shifted further left to show logo */
        .card-img-left { object-position: 10% center; }
        .badge-link { display: block; height: 48px; }
        /* Force white color for SVGs */
        .badge-img { height: 100%; width: auto; object-fit: contain; filter: brightness(0) invert(1); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-12 bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">Game Feedback & Downloads</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Toyland -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 relative">
                <img src="img/Toyland.png" alt="Toyland" class="card-img bg-zinc-800">
                <div class="absolute bottom-2 right-2 text-[10px] text-zinc-500 font-medium">Propriedade da Minimol Games</div>
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-4">Toyland</h2>
                    <a href="https://forms.clickup.com/30912035/f/xfbh3-44613/X8BI3UVDMIVPEE76C4" class="text-violet-400 hover:text-violet-300 font-semibold">Deixe seu Feedback</a>
                </div>
            </div>

            <!-- Greek War -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 relative">
                <img src="img/Greek.png" alt="Greek War" class="card-img card-img-left bg-zinc-800">
                <div class="absolute bottom-2 right-2 text-[10px] text-zinc-500 font-medium">Propriedade da Universal Lab</div>
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-4">Greek War</h2>
                    <a href="https://store.steampowered.com/app/3852760/Greek_War/" class="text-violet-400 hover:text-violet-300 font-semibold">Ver na Steam</a>
                </div>
            </div>

            <!-- Case Solved -->
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 relative">
                <img src="img/Case.png" alt="Case Solved" class="card-img card-img-left bg-zinc-800">
                <div class="absolute bottom-2 right-2 text-[10px] text-zinc-500 font-medium">Propriedade da Minimol Games</div>
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-4">Case Solved</h2>
                    <p class="text-zinc-400 mb-4">Experimente Gratuitamente</p>
                    <div class="flex flex-col gap-3">
                        <a href="https://play.google.com/store/apps/details?id=com.MinimolGames.CaseSolved&hl=pt_PT" class="badge-link">
                            <img src="img/Android.svg" alt="Google Play" class="badge-img">
                        </a>
                        <a href="https://apps.apple.com/us/app/case-solved-the-london-files/id6769660234?l=pt-BR" class="badge-link">
                            <img src="img/iOS.svg" alt="App Store" class="badge-img">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
